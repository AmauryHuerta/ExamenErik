services:
  - type: web
    name: examenerik-api
    runtime: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: ./sistema-m01-m02/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_RECOVERY_MODE
        value: disabled
      - key: APP_RECOVERY_BASE_URL
        value: https://examenerik-frontend.onrender.com/reset-password.html
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_COOKIE_SAME_SITE
        value: None
      - key: APP_BOOTSTRAP_ENABLED
        value: "true"
      - key: APP_BOOTSTRAP_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_PASSWORD
        sync: false

  - type: web
    name: examenerik-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: APP_API_BASE_PATH
        value: https://examenerik-api.onrender.com/api
      - key: NODE_VERSION
        value: 24.11.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
